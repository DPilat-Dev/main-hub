name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub_dev_password
          POSTGRES_DB: main_hub
        ports:
          - 5442:5432
        options: >-
          --health-cmd="pg_isready -U hub -d main_hub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://hub:hub_dev_password@localhost:5442/main_hub?schema=public
      DIRECT_URL: postgresql://hub:hub_dev_password@localhost:5442/main_hub?schema=public
      AUTH_SECRET: ci-placeholder-secret-not-used-in-prod
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-password
      ADMIN_NAME: CI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
