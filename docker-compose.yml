services:
  db:
    image: postgres:17-alpine
    container_name: main-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub_dev_password
      POSTGRES_DB: main_hub
    ports:
      - "5442:5432"
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d main_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hub_pgdata:
