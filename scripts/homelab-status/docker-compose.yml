services:
  homelab-status:
    build: .
    container_name: homelab-status
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PVE_HOST: "192.168.1.24"
      PVE_PORT: "8006"
      # Set PVE_TOKEN in a .env file next to this compose file:
      #   PVE_TOKEN=root@pam!claude-readonly=YOUR-SECRET
      PVE_TOKEN: "${PVE_TOKEN:?set PVE_TOKEN in .env}"
      LISTEN_PORT: "8787"
      # Enable real service uptime/latency via your Blackbox exporter.
      # Comment out to fall back to "is the LXC running" from Proxmox.
      BLACKBOX_URL: "http://192.168.1.66:9115"
      # Enable 24h CPU/memory sparklines + per-service uptime % from Prometheus
      # (uses pve-exporter data you already scrape).
      PROM_URL: "http://192.168.1.242:9090"
      # Enable live Synology NAS volume capacity via SNMP (LAN-only).
      SYNO_HOST: "192.168.1.3"
      SYNO_COMMUNITY: "homelab-ro"
      # Optional: protect the endpoint with a shared secret (also set
      # HOMELAB_STATUS_TOKEN to the same value on Vercel).
      # STATUS_TOKEN: "${STATUS_TOKEN:-}"
